# Builds the study website in website-code/ and publishes it to GitHub Pages on every push to main.
name: Deploy study website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r website-code/requirements.txt
      - name: Build site
        working-directory: website-code
        run: |
          python build.py
          mkdocs build -f mkdocs.gen.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website-code/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
