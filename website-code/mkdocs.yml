# Base site configuration. build.py generates docs/ and mkdocs.gen.yml (which adds the nav).
site_name: MuleSoft Course — Study Notes
site_description: Notes, slides, quizzes, flashcards and mind maps for the MuleSoft Telugu course (Green Cloud batch)
site_url: https://developerashok99.github.io/green-c-mule-notes/
repo_url: https://github.com/developerashok99/green-c-mule-notes
repo_name: green-c-mule-notes
edit_uri: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    logo: material/school
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_javascript:
  - assets/study.js

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
